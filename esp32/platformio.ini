[env:esp32dev]
; Pinned: Arduino-ESP32 2.0.17 (ESP-IDF 4.4). The firmware uses the legacy I2S pin API, which ESP-IDF 5 dropped.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#a9e946a078f9bc5334038cbf90a7237e9e726cd2
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.17.0
    kosme/arduinoFFT @ ^2.0.4
